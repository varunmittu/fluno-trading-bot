<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluno Bot — Live</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --line:#232a34; --ink:#e6edf3; --ink2:#9fb0c3;
    --mut:#6b7683; --good:#2ecc71; --bad:#e5534b; --gold:#e3b341; --acc:#58a6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:12px;max-width:640px;margin:0 auto;-webkit-font-smoothing:antialiased}
  h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mut);display:inline-block}
  .dot.live{background:var(--good);box-shadow:0 0 8px var(--good);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .sub{color:var(--mut);font-size:11px;margin-top:2px}
  .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.5px}
  .pill.paper{background:#1f2d3d;color:var(--acc)} .pill.real{background:#3d1f22;color:var(--bad)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .v{font-size:22px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .v.sm{font-size:16px}
  .full{grid-column:1/3}
  .ct{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:8px;display:flex;justify-content:space-between}
  table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  th{text-align:left;color:var(--mut);font-weight:600;font-size:10px;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
  td{padding:6px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px}
  .ce{background:#132b1e;color:var(--good)} .pe{background:#2b1516;color:var(--bad)}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .cal{display:flex;flex-wrap:wrap;gap:5px}
  .day{width:calc(20% - 4px);border-radius:7px;padding:6px 4px;text-align:center;font-size:9px;line-height:1.3}
  .day .d{color:var(--mut)} .day .p{font-weight:700;font-size:11px;margin-top:1px}
  .day.g{background:rgba(46,204,113,.12)} .day.r{background:rgba(229,83,75,.12)}
  .log{font-family:ui-monospace,Menlo,monospace;font-size:10px;line-height:1.7;max-height:180px;overflow-y:auto;color:var(--ink2)}
  .log .t{color:var(--mut);margin-right:6px} .log .err{color:var(--bad)} .log .ok{color:var(--good)}
  .trust{display:flex;align-items:baseline;gap:8px}
  .trust .big{font-size:26px;font-weight:800}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar > i{display:block;height:100%;border-radius:3px}
  .chk{font-size:10px;color:var(--ink2);line-height:1.9;margin-top:6px}
  .foot{text-align:center;color:var(--mut);font-size:10px;margin:16px 0 4px}
</style>
</head>
<body>
  <h1><span class="dot" id="live"></span> Fluno Trading Bot <span class="pill paper" id="mode">PAPER</span></h1>
  <div class="sub" id="updated">loading…</div>

  <div class="grid">
    <div class="card"><div class="k">Capital</div><div class="v" id="cap">—</div></div>
    <div class="card"><div class="k">Total P&amp;L</div><div class="v" id="pnl">—</div></div>
    <div class="card"><div class="k">Today</div><div class="v sm" id="today">—</div></div>
    <div class="card"><div class="k">Win rate</div><div class="v sm" id="wr">—</div></div>

    <div class="card full">
      <div class="ct"><span>Real-Money Trust</span><span id="nifty" class="k"></span></div>
      <div class="trust"><span class="big" id="trust">—</span><span class="k" id="trustn"></span></div>
      <div class="bar"><i id="trustbar" style="width:0%;background:var(--bad)"></i></div>
      <div class="chk" id="chk"></div>
      <div class="k" id="verdict" style="margin-top:6px;text-transform:none;font-size:11px"></div>
    </div>

    <div class="card full">
      <div class="ct"><span>Daily P&amp;L</span><span id="gr" class="k"></span></div>
      <div class="cal" id="cal"></div>
    </div>

    <div class="card full">
      <div class="ct"><span>Recent trades</span><span class="k" id="ntr"></span></div>
      <div style="overflow-x:auto">
        <table><thead><tr><th>Date</th><th>Time</th><th>Bet</th><th>Entry</th><th>Exit</th><th style="text-align:right">P&amp;L</th></tr></thead>
        <tbody id="trades"></tbody></table>
      </div>
    </div>

    <div class="card full">
      <div class="ct">Bot Log</div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="foot">Auto-refreshes every 30s · read-only mirror of the bot on Sai's machine</div>

<script>
const rs = n => 'Rs.' + Math.abs(Math.round(n)).toLocaleString('en-IN');
const sg = n => (n>=0?'+':'-') + rs(n);
function cls(n){return n>0?'pos':(n<0?'neg':'')}

async function load(){
  let d;
  try{ d = await fetch('trades.json?t='+Date.now()).then(r=>r.json()); }
  catch(e){ document.getElementById('updated').textContent='could not load data'; return; }

  document.getElementById('updated').textContent = 'updated ' + (d.last_updated||'');
  document.getElementById('live').className = 'dot' + (d.market_open?' live':'');
  const m = (d.trade_mode||'paper');
  const mp = document.getElementById('mode');
  mp.textContent = m.toUpperCase(); mp.className = 'pill ' + (m==='real'?'real':'paper');

  const s = d.summary||{};
  document.getElementById('cap').textContent = d.running_capital ? rs(d.running_capital) : '—';
  const pnlEl = document.getElementById('pnl');
  pnlEl.textContent = sg(s.total_pnl||0); pnlEl.className = 'v ' + cls(s.total_pnl||0);
  document.getElementById('wr').textContent = (s.win_rate||0) + '%';

  const dp = d.daily_pnl||{};
  const dates = Object.keys(dp).sort();
  const tkey = dates[dates.length-1];
  const tEl = document.getElementById('today');
  if(tkey){ tEl.textContent = sg(dp[tkey]); tEl.className='v sm '+cls(dp[tkey]); }

  document.getElementById('nifty').textContent = (d.nifty_price && d.nifty_price!=='--') ? ('NIFTY '+Math.round(d.nifty_price)) : '';

  const v = d.validation;
  if(v && !v.empty){
    document.getElementById('trust').textContent = v.trust;
    document.getElementById('trustn').textContent = '/ 10  ·  '+v.n+'/'+v.target_n+' trades · '+v.live_wr+'% win';
    const col = v.trust>=7?'var(--good)':(v.trust>=5?'var(--gold)':'var(--bad)');
    const bar = document.getElementById('trustbar');
    bar.style.width = Math.min(100, v.trust*10)+'%'; bar.style.background = col;
    document.getElementById('trust').style.color = col;
    const c = v.components||{};
    const ic = ok => ok?'<span style="color:var(--good)">&#10003;</span>':'<span style="color:var(--bad)">&#10007;</span>';
    document.getElementById('chk').innerHTML =
      ic(c.data>=3)+' data '+v.n+'/'+v.target_n+' &nbsp; '+ic(c.profitable)+' profitable &nbsp; '+ic(c.tracking)+' tracks backtest<br>'+
      ic(c.edge_real)+' edge real (CI&gt;0) &nbsp; '+ic(c.full_sample)+' full sample';
    document.getElementById('verdict').textContent = v.verdict||'';
  } else {
    document.getElementById('trust').textContent = '—';
    document.getElementById('verdict').textContent = 'waiting for validation data';
  }

  let green=0, red=0;
  const cal = dates.slice(-15).map(dt=>{
    const p = dp[dt]; if(p>0)green++; else if(p<0)red++;
    return `<div class="day ${p>0?'g':(p<0?'r':'')}"><div class="d">${dt.slice(5)}</div><div class="p ${cls(p)}">${p>0?'+':''}${Math.round(p)}</div></div>`;
  }).join('');
  document.getElementById('cal').innerHTML = cal;
  document.getElementById('gr').textContent = green+' green / '+red+' red';

  const tr = (d.trades||[]).slice(-12).reverse().map(t=>{
    const bet = t.option_type==='CE'?'<span class="tag ce">CALL</span>':'<span class="tag pe">PUT</span>';
    return `<tr><td>${(t.date||'').slice(5)}</td><td>${t.time||''}</td><td>${bet}</td>
      <td>${Math.round(t.entry)}</td><td>${Math.round(t.exit)}</td>
      <td style="text-align:right" class="${cls(t.pnl)}">${t.pnl>=0?'+':''}${Math.round(t.pnl)}</td></tr>`;
  }).join('');
  document.getElementById('trades').innerHTML = tr || '<tr><td colspan="6" style="color:var(--mut)">no trades yet</td></tr>';
  document.getElementById('ntr').textContent = (s.total_trades||0)+' all-time';

  document.getElementById('log').innerHTML = (d.bot_log||[]).map(e=>
    `<div><span class="t">${e.time}</span><span class="${e.cls||''}">${(e.msg||'').replace(/</g,'&lt;')}</span></div>`).join('');
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
